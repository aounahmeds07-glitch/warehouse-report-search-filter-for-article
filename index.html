<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Warehouse Inventory Search</title>
    <!-- PWA Meta -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0b1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <!-- SheetJS (XLSX) loaded from CDN – cached after first load -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <style>
        /* ============================================================
               CSS – Professional Warehouse Dashboard
               ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0b1a2e;
            --primary-light: #1a2f4a;
            --primary-dark: #060e1a;
            --accent: #3b9eff;
            --accent-hover: #5aadff;
            --accent-glow: rgba(59, 158, 255, 0.25);
            --bg-body: #f0f4f9;
            --bg-card: #ffffff;
            --bg-header: #0b1a2e;
            --text-primary: #1a2634;
            --text-secondary: #4a5a6e;
            --text-muted: #8a9aa8;
            --text-white: #f0f6ff;
            --border-color: #dce4ec;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.10);
            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.14);
            --radius: 12px;
            --radius-sm: 6px;
            --transition: 0.2s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --table-header-bg: #0b1a2e;
            --table-header-text: #ffffff;
            --table-row-hover: #eaf2fc;
            --table-stripe: #f8fafc;
            --footer-bg: #0b1a2e;
            --footer-text: #8ab4ff;
        }

        html {
            font-size: 14px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e8edf4;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b0c4d8;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8aa0b8;
        }

        /* ----- SVG ICON helpers ----- */
        .icon-svg {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ----- BUTTONS ----- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            letter-spacing: 0.01em;
            font-family: var(--font);
            text-decoration: none;
            white-space: nowrap;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(59, 158, 255, 0.35);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 20px rgba(59, 158, 255, 0.45);
        }

        .btn-outline-light {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }
        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.25);
            transform: none;
        }

        .btn-danger-ghost {
            background: transparent;
            box-shadow: none;
            color: #d45a6a;
        }
        .btn-danger-ghost:hover {
            background: rgba(212, 90, 106, 0.08);
            color: #b83a4a;
        }

        .btn-success {
            background: #2e7d32;
            color: #fff;
            box-shadow: 0 4px 14px rgba(46, 125, 50, 0.35);
        }
        .btn-success:hover {
            background: #388e3c;
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.45);
        }

        /* ----- HEADER ----- */
        .app-header {
            background: var(--bg-header);
            color: var(--text-white);
            padding: 14px 32px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .header-left h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 60%, #8abfff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .badge {
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #b8d4ff;
            border: 1px solid rgba(255, 255, 255, 0.06);
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header-right .btn {
            font-size: 0.8rem;
            padding: 7px 16px;
        }
        .header-right .btn .icon-svg {
            width: 16px;
            height: 16px;
        }

        .export-dropdown {
            position: relative;
            display: inline-block;
        }
        .export-menu {
            display: none;
            position: absolute;
            top: 110%;
            right: 0;
            background: #fff;
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            min-width: 160px;
            padding: 6px 0;
            z-index: 50;
            border: 1px solid var(--border-color);
        }
        .export-menu.show {
            display: block;
        }
        .export-menu button {
            display: block;
            width: 100%;
            padding: 9px 20px;
            border: none;
            background: transparent;
            text-align: left;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .export-menu button:hover {
            background: #f0f6fe;
            color: var(--accent);
        }
        .export-menu button .icon-svg {
            width: 16px;
            height: 16px;
            opacity: 0.6;
        }

        /* ----- OFFLINE INDICATOR ----- */
        .offline-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #b8d4ff;
        }
        .offline-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .offline-indicator .dot.online {
            background: #4caf50;
        }
        .offline-indicator .dot.offline {
            background: #f44336;
        }

        /* ----- SEARCH ----- */
        .search-section {
            padding: 20px 32px 8px 32px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
        }
        .search-wrapper {
            position: relative;
            max-width: 720px;
            margin: 0 auto;
        }
        .search-wrapper .icon-svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
            pointer-events: none;
            width: 20px;
            height: 20px;
        }
        #searchInput {
            width: 100%;
            padding: 14px 20px 14px 52px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-body);
            transition: var(--transition);
            font-family: var(--font);
            color: var(--text-primary);
            outline: none;
        }
        #searchInput:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        #searchInput::placeholder {
            color: var(--text-muted);
        }
        .search-hint {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.65rem;
            color: var(--text-muted);
            background: var(--bg-body);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            pointer-events: none;
            opacity: 0.6;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        #searchInput:focus+.search-hint,
        #searchInput:not(:placeholder-shown)+.search-hint {
            opacity: 0;
        }

        /* ----- FILTERS ----- */
        .filters-section {
            padding: 12px 32px 18px 32px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            transition: max-height 0.35s ease, opacity 0.3s ease, padding 0.3s ease;
            max-height: 800px;
            overflow: hidden;
            opacity: 1;
        }
        .filters-section.collapsed {
            max-height: 0;
            padding: 0 32px;
            opacity: 0;
            border-bottom: none;
        }
        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px 16px;
            align-items: end;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .filter-group label {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }
        .filter-group input {
            padding: 8px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-family: var(--font);
            background: var(--bg-body);
            transition: var(--transition);
            color: var(--text-primary);
            outline: none;
            width: 100%;
            min-width: 0;
        }
        .filter-group input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .filter-group input::placeholder {
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .filter-group input[type="date"] {
            min-height: 38px;
        }

        /* ----- SUMMARY ----- */
        .summary-section {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 28px;
            padding: 14px 32px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }
        .summary-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
        }
        .summary-item .icon-svg {
            width: 18px;
            height: 18px;
            opacity: 0.5;
            color: var(--text-secondary);
        }
        .summary-item .label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .summary-item .value {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            background: var(--bg-body);
            padding: 2px 12px;
            border-radius: 40px;
            min-width: 40px;
            text-align: center;
        }

        /* ----- TABLE ----- */
        .table-section {
            flex: 1;
            padding: 20px 32px 8px 32px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .table-container {
            flex: 1;
            overflow: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            background: #fff;
            box-shadow: var(--shadow-sm);
            min-height: 280px;
            position: relative;
        }
        #resultTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            table-layout: auto;
        }
        #resultTable thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        #resultTable th {
            background: var(--table-header-bg);
            color: var(--table-header-text);
            font-weight: 600;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 2px solid #1a2f4a;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: var(--transition);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            position: relative;
        }
        #resultTable th:hover {
            background: #1a2f4a;
            color: #fff;
        }
        #resultTable th .sort-icon {
            margin-left: 6px;
            display: inline-flex;
            opacity: 0.4;
            width: 12px;
            height: 12px;
            vertical-align: middle;
            color: #8ab4ff;
        }
        #resultTable th.sorted-asc .sort-icon,
        #resultTable th.sorted-desc .sort-icon {
            opacity: 1;
            color: var(--accent);
        }
        #resultTable th.sorted-desc .sort-icon {
            transform: rotate(180deg);
        }

        #resultTable td {
            padding: 10px 14px;
            border-bottom: 1px solid #eef2f7;
            color: var(--text-primary);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        #resultTable tbody tr {
            transition: background 0.15s ease;
        }
        #resultTable tbody tr:nth-child(even) {
            background: var(--table-stripe);
        }
        #resultTable tbody tr:hover {
            background: var(--table-row-hover);
        }
        #resultTable tbody tr:active {
            background: #d4e3fd;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon-svg {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            opacity: 0.3;
            display: block;
            color: var(--text-muted);
        }
        .empty-state p {
            font-size: 0.95rem;
        }

        /* ----- TABLE FOOTER (pagination) ----- */
        .table-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 0 0;
            gap: 12px;
        }
        .pagination-info {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pagination-controls .page-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            color: var(--text-primary);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .pagination-controls .page-btn .icon-svg {
            width: 14px;
            height: 14px;
        }
        .pagination-controls .page-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: #f0f7ff;
        }
        .pagination-controls .page-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .page-numbers {
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0 8px;
            color: var(--text-secondary);
            min-width: 50px;
            text-align: center;
        }
        #pageSizeSelect {
            padding: 5px 10px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            background: var(--bg-card);
            font-weight: 500;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            font-family: var(--font);
        }

        /* ----- DETAIL MODAL ----- */
        .detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .detail-overlay.active {
            display: flex;
        }
        .detail-card {
            background: #fff;
            border-radius: var(--radius);
            max-width: 640px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            padding: 0;
            animation: fadeScale 0.2s ease;
        }
        @keyframes fadeScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .detail-header {
            background: var(--table-header-bg);
            color: #fff;
            padding: 18px 24px;
            border-radius: var(--radius) var(--radius) 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .detail-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0;
        }
        .detail-header .close-btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            line-height: 1;
        }
        .detail-header .close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .detail-body {
            padding: 24px 28px;
        }
        .detail-item {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #edf2f7;
            font-size: 0.88rem;
        }
        .detail-item:last-child {
            border-bottom: none;
        }
        .detail-item .label {
            width: 40%;
            font-weight: 600;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .detail-item .value {
            width: 60%;
            color: var(--text-primary);
            word-break: break-word;
        }
        .detail-item .value.empty {
            color: var(--text-muted);
            font-style: italic;
        }

        /* ----- FOOTER ----- */
        .app-footer {
            background: var(--footer-bg);
            color: var(--footer-text);
            padding: 16px 32px;
            text-align: center;
            font-size: 0.82rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 12px;
            letter-spacing: 0.02em;
        }
        .app-footer .heart {
            color: #ff6b6b;
            display: inline-block;
        }
        .app-footer .name {
            font-weight: 700;
            color: #fff;
        }

        /* ----- INSTALL BANNER ----- */
        .install-banner {
            display: none;
            background: var(--bg-header);
            color: #fff;
            padding: 12px 32px;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap;
        }
        .install-banner.show {
            display: flex;
        }
        .install-banner .msg {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }
        .install-banner .msg .icon-svg {
            width: 24px;
            height: 24px;
            color: var(--accent);
        }
        .install-banner .actions {
            display: flex;
            gap: 10px;
        }

        /* ----- LOADING OVERLAY ----- */
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(11, 26, 46, 0.55);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        .loading-overlay.active {
            display: flex;
        }
        .loading-spinner {
            width: 52px;
            height: 52px;
            border: 5px solid rgba(255, 255, 255, 0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-overlay p {
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            .app-header {
                padding: 12px 18px;
            }
            .header-left h1 {
                font-size: 1rem;
            }
            .search-section,
            .filters-section,
            .summary-section,
            .table-section {
                padding-left: 18px;
                padding-right: 18px;
            }
            .filters-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
            .summary-section {
                gap: 4px 16px;
            }
            .summary-item {
                font-size: 0.75rem;
            }
            #resultTable th,
            #resultTable td {
                padding: 8px 10px;
                font-size: 0.7rem;
            }
            .table-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .pagination-controls {
                justify-content: center;
            }
            .header-right .btn span {
                display: none;
            }
            .filters-section.collapsed {
                padding: 0 18px;
            }

                max-width: 95%;

            }

        @media (max-width: 500px) {
            .filters-grid {

            }

            #searchInput {
                font-size: 0.85rem;
                padding: 12px 16px 12px 46px;
            }
            .search-hint {
                display: none;
            }
            .table-container {
                border-radius: var(--radius-sm);
            }
            .summary-item .value {
                font-size: 0.8rem;
                padding: 1px 8px;

                flex-direction: column;
                text-align: center;
            }
            .install-banner .actions {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- ===== INSTALL BANNER ===== -->
    <div class="install-banner" id="installBanner">

            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

    <!-- ===== SEARCH ===== -->

        <div class="summary-item">

        <div class="summary-item">

            <span class="label">Valuation</span><span class="value" id="sumValuation">0</span>
        </div>
        <div class="summary-item">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            <span class="label">Unique Models</span><span class="value" id="sumModels">0</span>
        </div>

    <!-- ===== TABLE ===== -->
    <section class="table-section">
        <div class="table-container" id="tableContainer">
            <table id="resultTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="table-footer">
            <div class="pagination-info" id="paginationInfo">Showing 0–0 of 0</div>
            <div class="pagination-controls">
                <button class="page-btn" id="pagePrev" disabled>
                    <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <span class="page-numbers" id="pageNumbers">1</span>
                <button class="page-btn" id="pageNext" disabled>
                    <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
                <select id="pageSizeSelect">
                    <option value="25">25</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>

                </select>
            </div>

    <!-- ===== DETAIL MODAL ===== -->
    <div class="detail-overlay" id="detailOverlay">
        <div class="detail-card">
            <div class="detail-header">
                <h2 id="detailTitle">Record Details</h2>

                <!-- dynamically populated -->

            <div style="padding:12px 28px 20px 28px;border-top:1px solid #edf2f7;text-align:center;font-size:0.75rem;color:var(--text-muted);">

            Developed with <span class="heart">❤</span> by <span class="name">Aoun Ahmed</span>

        </span>
    </footer>

    <!-- ===== LOADING OVERLAY ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>Processing data…</p>
    </div>

    <script>
        // ================================================================
        //  SCRIPT – Warehouse Inventory Search Engine (PWA Ready)
        //  All JavaScript in one file, fully offline.
        // ================================================================

        (function() {
            'use strict';

            // ---- DOM refs ----
            const fileInput = document.getElementById('fileInput');
            const importBtn = document.getElementById('importBtn');
            const toggleFiltersBtn = document.getElementById('toggleFiltersBtn');
            const clearFiltersBtn = document.getElementById('clearFiltersBtn');
            const searchInput = document.getElementById('searchInput');
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');
            const recordBadge = document.getElementById('recordBadge');
            const sumRecords = document.getElementById('sumRecords');
            const sumBoxes = document.getElementById('sumBoxes');
            const sumItems = document.getElementById('sumItems');
            const sumValuation = document.getElementById('sumValuation');
            const sumModels = document.getElementById('sumModels');
            const paginationInfo = document.getElementById('paginationInfo');
            const pageNumbers = document.getElementById('pageNumbers');
            const pagePrev = document.getElementById('pagePrev');
            const pageNext = document.getElementById('pageNext');
            const pageSizeSelect = document.getElementById('pageSizeSelect');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const exportBtn = document.getElementById('exportBtn');
            const exportMenu = document.getElementById('exportMenu');
            const filtersSection = document.getElementById('filtersSection');

            // ---- detail modal ----
            const detailOverlay = document.getElementById('detailOverlay');
            const detailTitle = document.getElementById('detailTitle');
            const detailBody = document.getElementById('detailBody');
            const detailCloseBtn = document.getElementById('detailCloseBtn');

            // ---- install banner ----
            const installBanner = document.getElementById('installBanner');
            const installAppBtn = document.getElementById('installAppBtn');
            const dismissInstallBtn = document.getElementById('dismissInstallBtn');

            // ---- offline indicator ----
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            // ---- filter inputs ----
            const filterLocation = document.getElementById('filterLocation');
            const filterModel = document.getElementById('filterModel');
            const filterPlacedBy = document.getElementById('filterPlacedBy');
            const filterFloor = document.getElementById('filterFloor');
            const filterDept = document.getElementById('filterDept');
            const filterItemId = document.getElementById('filterItemId');
            const filterPallet = document.getElementById('filterPallet');
            const filterPlaceFrom = document.getElementById('filterPlaceFrom');
            const filterPlaceTo = document.getElementById('filterPlaceTo');
            const filterReceiveFrom = document.getElementById('filterReceiveFrom');
            const filterReceiveTo = document.getElementById('filterReceiveTo');
            const filterBoxMin = document.getElementById('filterBoxMin');
            const filterBoxMax = document.getElementById('filterBoxMax');

            // ---- state ----
            let allData = [];
            let filteredData = [];
            let currentPage = 1;
            let pageSize = 50;
            let sortKey = null;
            let sortDir = 'asc';
            let searchTerm = '';
            let deferredPrompt = null;

            // ---- column definitions ----
            const ALL_COLUMNS = [
                'Location', 'Model Number', 'Boxes', 'Items/Box', 'Total Items',
                'Carton CBM', 'Box Rate', 'Valuation', 'Placed By',
                'Placement Date', 'Placement Time', 'Age Placed',
                'Received Date', 'Received Time', 'Age Received',
                'Pallet Serial', 'Received Department', 'Production Floor', 'Item ID'
            ];

            // ---- DISPLAY COLUMNS (new order: Pallet Serial, Model Number, Boxes, Location, Date, Time) ----
            // We'll use these column keys for data mapping, and override header text for "Placement Date" to "Date"
            const DISPLAY_COLUMNS = [
                'Pallet Serial',
                'Model Number',
                'Boxes',
                'Location',
                'Placement Date',  // will show as "Date"
                'Placement Time'
            ];

            // Map for custom header labels
            const HEADER_LABELS = {
                'Pallet Serial': 'Pallet Serial',
                'Model Number': 'Model Number',
                'Boxes': 'Boxes',
                'Location': 'Location',
                'Placement Date': 'Date',
                'Placement Time': 'Placement Time'
            };

            // ---- helpers ----
            function normalize(str) {
                if (str === undefined || str === null) return '';
                return String(str).trim().toLowerCase().replace(/\s+/g, ' ');
            }

            function parseNumber(v) {
                if (v === undefined || v === null || v === '') return 0;
                const n = parseFloat(String(v).replace(/,/g, ''));
                return isNaN(n) ? 0 : n;
            }

            function parseDate(v) {
                if (!v) return null;
                const d = new Date(v);
                return isNaN(d.getTime()) ? null : d;
            }

            // ---- data import ----
            function importFile(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
                        if (!json || json.length === 0) {
                            alert('No data found in file.');
                            return;
                        }
                        allData = json.map(row => {
                            const obj = {};
                            ALL_COLUMNS.forEach(col => {
                                obj[col] = row[col] !== undefined ? row[col] : '';
                            });
                            return obj;
                        });
                        searchTerm = '';
                        searchInput.value = '';
                        sortKey = null;
                        sortDir = 'asc';
                        currentPage = 1;
                        clearFilterInputs();
                        applyFiltersAndRender();
                        loadingOverlay.classList.remove('active');
                    } catch (err) {
                        loadingOverlay.classList.remove('active');
                        alert('Error reading file: ' + err.message);
                    }
                };
                reader.onerror = function() {
                    loadingOverlay.classList.remove('active');
                    alert('Failed to read file.');
                };
                loadingOverlay.classList.add('active');
                reader.readAsArrayBuffer(file);
            }

            // ---- filtering & searching ----
            function matchesSearch(row, term) {
                if (!term) return true;
                const lower = term.toLowerCase().trim();
                if (!lower) return true;

                const model = normalize(row['Model Number']);
                const itemId = normalize(row['Item ID']);
                const pallet = normalize(row['Pallet Serial']);
                const location = normalize(row['Location']);

                if (model === lower) return true;
                if (model.startsWith(lower)) return true;
                if (model.includes(lower)) return true;
                if (itemId === lower) return true;
                if (pallet === lower) return true;
                if (location.includes(lower)) return true;

                return false;
            }

            function matchesFilters(row) {
                const loc = normalize(filterLocation.value);
                if (loc && !normalize(row['Location']).includes(loc)) return false;

                const mdl = normalize(filterModel.value);
                if (mdl && !normalize(row['Model Number']).includes(mdl)) return false;

                const pb = normalize(filterPlacedBy.value);
                if (pb && !normalize(row['Placed By']).includes(pb)) return false;

                const fl = normalize(filterFloor.value);
                if (fl && !normalize(row['Production Floor']).includes(fl)) return false;

                const dept = normalize(filterDept.value);
                if (dept && !normalize(row['Received Department']).includes(dept)) return false;

                const itemId = normalize(filterItemId.value);
                if (itemId && !normalize(row['Item ID']).includes(itemId)) return false;

                const pallet = normalize(filterPallet.value);
                if (pallet && !normalize(row['Pallet Serial']).includes(pallet)) return false;

                const pFrom = filterPlaceFrom.value;
                if (pFrom) {
                    const d = parseDate(row['Placement Date']);
                    if (d && d < new Date(pFrom + 'T00:00:00')) return false;
                }
                const pTo = filterPlaceTo.value;
                if (pTo) {
                    const d = parseDate(row['Placement Date']);
                    if (d && d > new Date(pTo + 'T23:59:59')) return false;
                }
                const rFrom = filterReceiveFrom.value;
                if (rFrom) {
                    const d = parseDate(row['Received Date']);
                    if (d && d < new Date(rFrom + 'T00:00:00')) return false;
                }
                const rTo = filterReceiveTo.value;
                if (rTo) {
                    const d = parseDate(row['Received Date']);
                    if (d && d > new Date(rTo + 'T23:59:59')) return false;
                }

                const minBox = parseNumber(filterBoxMin.value);
                const maxBox = parseNumber(filterBoxMax.value);
                const boxes = parseNumber(row['Boxes']);
                if (minBox > 0 && boxes < minBox) return false;
                if (maxBox > 0 && boxes > maxBox) return false;

                return true;
            }

            function applyFiltersAndRender() {
                const term = searchInput.value;
                searchTerm = term;

                let result = allData.filter(row => matchesSearch(row, term));
                result = result.filter(row => matchesFilters(row));

                if (sortKey) {
                    const key = sortKey;
                    const dir = sortDir === 'asc' ? 1 : -1;
                    result.sort((a, b) => {
                        const va = a[key] !== undefined ? a[key] : '';
                        const vb = b[key] !== undefined ? b[key] : '';
                        if (['Boxes', 'Total Items', 'Valuation', 'Carton CBM', 'Box Rate'].includes(key)) {
                            return (parseNumber(va) - parseNumber(vb)) * dir;
                        }
                        if (key.includes('Date')) {
                            const da = parseDate(va);
                            const db = parseDate(vb);
                            if (da && db) return (da.getTime() - db.getTime()) * dir;
                            if (da) return -1 * dir;
                            if (db) return 1 * dir;
                            return String(va).localeCompare(String(vb)) * dir;
                        }
                        return String(va).localeCompare(String(vb)) * dir;
                    });
                }

                filteredData = result;
                updateSummary();
                renderTable();
            }

            // ---- summary ----
            function updateSummary() {
                const total = filteredData.length;
                let boxes = 0,
                    items = 0,
                    valuation = 0;
                const modelSet = new Set();
                filteredData.forEach(row => {
                    boxes += parseNumber(row['Boxes']);
                    items += parseNumber(row['Total Items']);
                    valuation += parseNumber(row['Valuation']);
                    const m = normalize(row['Model Number']);
                    if (m) modelSet.add(m);
                });
                sumRecords.textContent = total;
                sumBoxes.textContent = boxes.toLocaleString();
                sumItems.textContent = items.toLocaleString();
                sumValuation.textContent = valuation.toLocaleString(undefined, { minimumFractionDigits: 2,
                    maximumFractionDigits: 2 });
                sumModels.textContent = modelSet.size;
                recordBadge.textContent = total + ' records';
            }

            // ---- render table ----
            function renderTable() {
                const total = filteredData.length;
                const totalPages = Math.max(1, Math.ceil(total / pageSize));
                if (currentPage > totalPages) currentPage = totalPages;
                const start = (currentPage - 1) * pageSize;
                const end = Math.min(start + pageSize, total);
                const pageData = filteredData.slice(start, end);

                // Build header only once
                if (tableHead.children.length === 0) {
                    const tr = document.createElement('tr');
                    DISPLAY_COLUMNS.forEach(col => {
                        const th = document.createElement('th');
                        // Use custom header label
                        th.textContent = HEADER_LABELS[col] || col;
                        th.dataset.col = col; // keep original key for sorting
                        const icon = document.createElement('span');
                        icon.className = 'sort-icon';
                        icon.innerHTML =
                            '<svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><polyline points="6 9 12 15 18 9"/></svg>';
                        th.appendChild(icon);
                        th.addEventListener('click', function() {
                            const key = this.dataset.col;
                            if (sortKey === key) {
                                sortDir = sortDir === 'asc' ? 'desc' : 'asc';
                            } else {
                                sortKey = key;
                                sortDir = 'asc';
                            }
                            document.querySelectorAll('#tableHead th').forEach(h => {
                                h.classList.remove('sorted-asc', 'sorted-desc');
                            });
                            this.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
                            applyFiltersAndRender();
                        });
                        tr.appendChild(th);
                    });
                    tableHead.appendChild(tr);
                }

                // Update sort indicators
                document.querySelectorAll('#tableHead th').forEach(th => {
                    th.classList.remove('sorted-asc', 'sorted-desc');
                    if (th.dataset.col === sortKey) {
                        th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
                    }
                });

                if (pageData.length === 0) {
                    tableBody.innerHTML =
                        `<tr><td colspan="${DISPLAY_COLUMNS.length}" class="empty-state">
                            <svg class="icon-svg" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                            <p>No matching records</p>
                        </td></tr>`;
                } else {
                    let html = '';
                    pageData.forEach((row, index) => {
                        html += '<tr data-index="' + (start + index) + '">';
                        DISPLAY_COLUMNS.forEach(col => {
                            let val = row[col] !== undefined && row[col] !== null ? row[col] : '';
                            html += `<td>${String(val)}</td>`;
                        });
                        html += '</tr>';
                    });
                    tableBody.innerHTML = html;

                    tableBody.querySelectorAll('tr').forEach(tr => {
                        tr.addEventListener('click', function() {
                            const idx = parseInt(this.dataset.index, 10);
                            if (!isNaN(idx) && filteredData[idx]) {
                                showDetail(filteredData[idx]);
                            }
                        });
                    });
                }

                paginationInfo.textContent = total === 0 ?
                    'Showing 0–0 of 0' :
                    `Showing ${start+1}–${end} of ${total}`;
                pageNumbers.textContent = `${currentPage} / ${totalPages}`;
                pagePrev.disabled = currentPage <= 1;
                pageNext.disabled = currentPage >= totalPages;
            }

            // ---- detail modal ----
            function showDetail(row) {
                const model = row['Model Number'] || 'N/A';
                detailTitle.textContent = `📦 ${model}`;

                // Order: Pallet Serial, Location, then the rest (excluding those two)
                const priorityFields = ['Pallet Serial', 'Location'];
                const otherFields = ALL_COLUMNS.filter(col => !priorityFields.includes(col));

                let html = '';
                priorityFields.forEach(col => {
                    let val = row[col] !== undefined && row[col] !== null ? row[col] : '';
                    const isEmpty = val === '';
                    html += `<div class="detail-item">
                        <span class="label">${col}</span>
                        <span class="value${isEmpty ? ' empty' : ''}">${isEmpty ? '—' : String(val)}</span>
                    </div>`;
                });
                otherFields.forEach(col => {
                    let val = row[col] !== undefined && row[col] !== null ? row[col] : '';
                    if (col === 'Valuation' && val !== '') {
                        const n = parseNumber(val);
                        val = n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    }
                    const isEmpty = val === '';
                    html += `<div class="detail-item">
                        <span class="label">${col}</span>
                        <span class="value${isEmpty ? ' empty' : ''}">${isEmpty ? '—' : String(val)}</span>
                    </div>`;
                });

                detailBody.innerHTML = html;
                detailOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeDetail() {
                detailOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            // ---- clear filters ----
            function clearFilterInputs() {
                filterLocation.value = '';
                filterModel.value = '';
                filterPlacedBy.value = '';
                filterFloor.value = '';
                filterDept.value = '';
                filterItemId.value = '';
                filterPallet.value = '';
                filterPlaceFrom.value = '';
                filterPlaceTo.value = '';
                filterReceiveFrom.value = '';
                filterReceiveTo.value = '';
                filterBoxMin.value = '';
                filterBoxMax.value = '';
            }

            // ---- export ----
            function exportData(format) {
                if (filteredData.length === 0) {
                    alert('No data to export.');
                    return;
                }
                // Export using the same order as DISPLAY_COLUMNS, with header labels
                const dataToExport = filteredData.map(row => {
                    const obj = {};
                    DISPLAY_COLUMNS.forEach(col => {
                        const label = HEADER_LABELS[col] || col;
                        obj[label] = row[col] !== undefined ? row[col] : '';
                    });
                    return obj;
                });

                if (format === 'print') {
                    const win = window.open('', '_blank');
                    if (!win) { alert('Please allow popups for printing.'); return; }
                    let html = '<html><head><title>Warehouse Inventory</title><style>' +
                        'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:12px;padding:20px;}' +
                        'table{width:100%;border-collapse:collapse;font-size:11px;}' +
                        'th,td{border:1px solid #ccc;padding:6px 10px;text-align:left;}' +
                        'th{background:#0b1a2e;color:#fff;}' +
                        'h2{margin-bottom:4px;}' +
                        '.footer{margin-top:20px;padding-top:10px;border-top:1px solid #ddd;text-align:center;font-size:10px;color:#888;}' +
                        '</style></head><body>';
                    html += `<h2>Warehouse Inventory — ${new Date().toLocaleString()}</h2>`;
                    html += `<p>${filteredData.length} records</p>`;
                    const headers = DISPLAY_COLUMNS.map(col => HEADER_LABELS[col] || col);
                    html +=
                        `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
                    filteredData.forEach(row => {
                        html += '<tr>' + DISPLAY_COLUMNS.map(c => `<td>${String(row[c]||'')}</td>`).join('') +
                            '</tr>';
                    });
                    html += '</tbody></table>';
                    html +=
                        `<div class="footer">Developed with ❤️ by <strong>Aoun Ahmed</strong> · Warehouse Inventory PWA</div>`;
                    html += '</body></html>';
                    win.document.write(html);
                    win.document.close();
                    setTimeout(() => { win.print(); }, 300);
                    return;
                }

                // Excel/CSV
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(dataToExport);
                XLSX.utils.book_append_sheet(wb, ws, 'Inventory');
                const wbout = XLSX.write(wb, { bookType: format === 'csv' ? 'csv' : 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: format === 'csv' ? 'text/csv' :
                        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `inventory_export.${format === 'csv' ? 'csv' : 'xlsx'}`;
                a.click();
                URL.revokeObjectURL(url);
            }

            // ---- debounce ----
            function debounce(fn, ms) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), ms);
                };
            }

            // ---- offline status ----
            function updateOfflineStatus() {
                const online = navigator.onLine;
                statusDot.className = 'dot ' + (online ? 'online' : 'offline');
                statusText.textContent = online ? 'Online' : 'Offline';
            }

            // ---- PWA install ----
            function initPWA() {
                window.addEventListener('beforeinstallprompt', function(e) {
                    e.preventDefault();
                    deferredPrompt = e;
                    installBanner.classList.add('show');
                });

                window.addEventListener('appinstalled', function() {
                    installBanner.classList.remove('show');
                    deferredPrompt = null;
                });

                installAppBtn.addEventListener('click', function() {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then(function(choiceResult) {
                            if (choiceResult.outcome === 'accepted') {
                                installBanner.classList.remove('show');
                            }
                            deferredPrompt = null;
                        });
                    } else {
                        alert('Installation is not available right now. Try opening this page in Chrome or Edge.');
                    }
                });

                dismissInstallBtn.addEventListener('click', function() {
                    installBanner.classList.remove('show');
                });
            }

            // ---- init ----
            function init() {
                // Offline status
                updateOfflineStatus();
                window.addEventListener('online', updateOfflineStatus);
                window.addEventListener('offline', updateOfflineStatus);

                // PWA
                initPWA();

                // Import
                importBtn.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', function(e) {
                    if (this.files && this.files[0]) {
                        importFile(this.files[0]);
                    }
                    this.value = '';
                });

                // Search
                searchInput.addEventListener('input', debounce(applyFiltersAndRender, 200));

                // Filters
                const filterInputs = [
                    filterLocation, filterModel, filterPlacedBy, filterFloor, filterDept,
                    filterItemId, filterPallet,
                    filterPlaceFrom, filterPlaceTo, filterReceiveFrom, filterReceiveTo,
                    filterBoxMin, filterBoxMax
                ];
                filterInputs.forEach(inp => {
                    inp.addEventListener('input', debounce(applyFiltersAndRender, 150));
                    inp.addEventListener('change', applyFiltersAndRender);
                });

                // Toggle filters
                let filtersVisible = true;
                toggleFiltersBtn.addEventListener('click', function() {
                    filtersVisible = !filtersVisible;
                    filtersSection.classList.toggle('collapsed', !filtersVisible);
                    this.innerHTML = filtersVisible ?
                        '<svg class="icon-svg" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 13 10 21 14 18 14 13 22 3"/></svg><span>Filters</span>' :
                        '<svg class="icon-svg" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 13 10 21 14 18 14 13 22 3"/></svg><span>Filters</span>';
                });

                // Clear filters
                clearFiltersBtn.addEventListener('click', function() {
                    clearFilterInputs();
                    searchInput.value = '';
                    searchTerm = '';
                    sortKey = null;
                    sortDir = 'asc';
                    currentPage = 1;
                    applyFiltersAndRender();
                });

                // Pagination
                pagePrev.addEventListener('click', function() {
                    if (currentPage > 1) { currentPage--;
                        renderTable(); }
                });
                pageNext.addEventListener('click', function() {
                    const totalPages = Math.ceil(filteredData.length / pageSize);
                    if (currentPage < totalPages) { currentPage++;
                        renderTable(); }
                });
                pageSizeSelect.addEventListener('change', function() {
                    pageSize = parseInt(this.value, 10);
                    currentPage = 1;
                    renderTable();
                });

                // Export
                exportBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    exportMenu.classList.toggle('show');
                });
                document.addEventListener('click', function() {
                    exportMenu.classList.remove('show');
                });
                exportMenu.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const format = this.dataset.format;
                        exportData(format);
                        exportMenu.classList.remove('show');
                    });
                });

                // Detail modal
                detailCloseBtn.addEventListener('click', closeDetail);
                detailOverlay.addEventListener('click', function(e) {
                    if (e.target === this) closeDetail();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') closeDetail();
                });

                // Keyboard shortcut
                document.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                        e.preventDefault();
                        searchInput.focus();
                    }
                });

                // Initial render
                applyFiltersAndRender();
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>

</body>
</html>
